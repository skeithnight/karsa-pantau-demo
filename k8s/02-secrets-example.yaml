apiVersion: v1
kind: Secret
metadata:
  name: karsa-secrets
  namespace: karsa-pantau
type: Opaque
stringData:
  # Database Credentials
  DATABASE_USER: "karsa_user"
  DATABASE_PASSWORD: "change_this_to_strong_db_password"
  DATABASE_URL: "postgresql://karsa_user:change_this_to_strong_db_password@karsa-postgres-svc:5432/karsa_db?sslmode=disable"
  
  # JWT Auth Keys (min 32 chars)
  JWT_SECRET: "karsa_jwt_access_secret_production_key_32chars"
  JWT_REFRESH_SECRET: "karsa_jwt_refresh_secret_production_key_32chars"
  
  # Object Storage (MinIO / S3)
  OBJECT_STORAGE_KEY: "minio_admin_user"
  OBJECT_STORAGE_SECRET: "minio_admin_password_production"
  
  # 9Router AI Internal Gateway Token
  NINE_ROUTER_API_KEY: "nr-cluster-internal-api-key"

  # Upstream AI Provider Keys (Managed strictly inside 9Router Pod)
  ANTHROPIC_API_KEY: "sk-ant-api-key-goes-here"
  OPENAI_API_KEY: "sk-proj-openai-api-key-goes-here"

  # Web Push VAPID Keys
  VAPID_PUBLIC_KEY: "your_vapid_public_key"
  VAPID_PRIVATE_KEY: "your_vapid_private_key"
  VAPID_SUBJECT: "mailto:admin@karsapantau.id"
