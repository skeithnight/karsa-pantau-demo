apiVersion: apps/v1
kind: Deployment
metadata:
  name: karsa-9router
  namespace: karsa-pantau
  labels:
    app: karsa-9router
    tier: ai-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: karsa-9router
  template:
    metadata:
      labels:
        app: karsa-9router
    spec:
      containers:
        - name: 9router
          image: decolua/9router:latest
          ports:
            - containerPort: 20128
              name: proxy
          env:
            - name: PORT
              value: "20128"
            - name: ROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: karsa-secrets
                  key: NINE_ROUTER_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: karsa-secrets
                  key: ANTHROPIC_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: karsa-secrets
                  key: OPENAI_API_KEY
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 20128
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 20128
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: karsa-9router-svc
  namespace: karsa-pantau
spec:
  type: ClusterIP
  selector:
    app: karsa-9router
  ports:
    - port: 20128
      targetPort: 20128
      name: proxy
