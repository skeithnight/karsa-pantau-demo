apiVersion: apps/v1
kind: Deployment
metadata:
  name: karsa-frontend
  namespace: karsa-pantau
  labels:
    app: karsa-frontend
    tier: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: karsa-frontend
  template:
    metadata:
      labels:
        app: karsa-frontend
    spec:
      containers:
        - name: frontend
          image: karsa/frontend:latest
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: karsa-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: karsa-frontend-svc
  namespace: karsa-pantau
spec:
  type: ClusterIP
  selector:
    app: karsa-frontend
  ports:
    - port: 3000
      targetPort: 3000
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: karsa-frontend-hpa
  namespace: karsa-pantau
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: karsa-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
