apiVersion: apps/v1
kind: Deployment
metadata:
  name: karsa-backend-api
  namespace: karsa-pantau
  labels:
    app: karsa-backend-api
    tier: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: karsa-backend-api
  template:
    metadata:
      labels:
        app: karsa-backend-api
    spec:
      containers:
        - name: backend-api
          image: karsa/backend-api:latest
          ports:
            - containerPort: 3001
              name: http
          envFrom:
            - configMapRef:
                name: karsa-config
            - secretRef:
                name: karsa-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/v1/health/liveness
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health/readiness
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
---
apiVersion: v1
kind: Service
metadata:
  name: karsa-backend-api-svc
  namespace: karsa-pantau
spec:
  type: ClusterIP
  selector:
    app: karsa-backend-api
  ports:
    - port: 3001
      targetPort: 3001
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: karsa-backend-api-hpa
  namespace: karsa-pantau
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: karsa-backend-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
